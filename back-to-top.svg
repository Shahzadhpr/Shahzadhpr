<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08f7fe"/>
      <stop offset="50%" stop-color="#ff2e63"/>
      <stop offset="100%" stop-color="#8a2be2"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2e63" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff2e63" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- pulsing outer glow -->
  <circle cx="40" cy="40" r="30" fill="url(#glow)">
    <animate attributeName="r" values="26;36;26" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- rotating dashed ring -->
  <circle cx="40" cy="40" r="27" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="4 6" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- solid circle body -->
  <circle cx="40" cy="40" r="24" fill="#0d1117" stroke="url(#ringGrad)" stroke-width="2.5">
    <animate attributeName="r" values="24;25.5;24" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- bouncing arrow -->
  <g>
    <polyline points="28,45 40,31 52,45" fill="none" stroke="url(#ringGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="translate" values="0 5; 0 -3; 0 5" dur="1.2s" repeatCount="indefinite"/>
    </polyline>
    <line x1="40" y1="50" x2="40" y2="34" stroke="url(#ringGrad)" stroke-width="4.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0 5; 0 -3; 0 5" dur="1.2s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
